repos:
  - repo: local
    hooks:
      - id: pytest
        name: Kör tester
        entry: pytest
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: behave
        name: Kör Behave-tester
        entry: behave
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
